  mysql:
    image: mysql:8.0
    container_name: labmanager-mysql
    restart: unless-stopped
    env_file: .env.production
    command: --max_connections=2000
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - labmanager-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-prod
    container_name: labmanager-backend
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "3001:3001"
    volumes:
      - logs_data:/app/logs
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - labmanager-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3001/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: client-prod
    container_name: labmanager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - labmanager-network
    healthcheck:
      # BusyBox wget (nginx:alpine) does not support --spider; use -O /dev/null instead
      test: ["CMD", "wget", "-q", "--tries=1", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
    driver: local
  logs_data:
    driver: local

networks:
  labmanager-network:
    driver: bridge