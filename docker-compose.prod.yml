services:
  redis:
    image: redis:7-alpine
    container_name: labmanager_redis
    ports:
      - "6379:6379"
    networks:
      - labmanager-network
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

