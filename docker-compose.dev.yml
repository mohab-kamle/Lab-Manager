services:
  redis:
    image: redis:7-alpine
    container_name: labmanager_redis_dev
    ports:
      - "6379:6379"
    networks:
      - labmanager-network
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: labmanager-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-labmanager}
      MYSQL_USER: ${MYSQL_USER:-labuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-labpassword}
    command: --max_connections=2000
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - labmanager-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .  # CHANGED: Context is now the root
      dockerfile: Dockerfile
      target: server-dev
      args:
        NODE_ENV: development
    container_name: labmanager-backend-dev
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER:-labuser}:${MYSQL_PASSWORD:-labpassword}@mysql:3306/${MYSQL_DATABASE:-labmanager}
      PORT: 3001
      SECRET_KEY: ${SECRET_KEY:-your-secret-key}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app/server       # CHANGED: Mount source to /app/server
      - /app/node_modules          # CHANGED: Preserve root node_modules
      - /app/server/node_modules   # CHANGED: Preserve server node_modules
      - uploads_data_dev:/app/server/uploads # CHANGED: Update path
      - logs_data_dev:/app/server/logs       # CHANGED: Update path
      - ./uploads:/app/server/uploads/shared # CHANGED: Update path
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - labmanager-network
    # CHANGED: Added 'prefix' to run command in the server workspace
    command: sh -c "npx sequelize-cli db:create && npm run dev && npx sequelize-cli db:migrate"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: . # CHANGED: Context is now the root
      dockerfile: Dockerfile
      target: client-dev
      args:
        NODE_ENV: development
    container_name: labmanager-frontend-dev
    restart: unless-stopped
    env_file: 
      - .env.development
    environment:
      NODE_ENV: development
      VITE_SERVER: http://localhost:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client      # CHANGED: Mount source to /app/client
      - /app/node_modules         # CHANGED: Preserve root node_modules
      - /app/client/node_modules  # CHANGED: Preserve client node_modules
    depends_on:
      - backend
    networks:
      - labmanager-network
    # CHANGED: Added 'prefix' to run command in the client workspace
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mysql_data_dev:
    driver: local
  uploads_data_dev:
    driver: local
  logs_data_dev:
    driver: local

networks:
  labmanager-network:
    driver: bridge