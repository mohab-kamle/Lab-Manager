services:
  redis:
    image: redis:7-alpine
    container_name: labmanager_redis_dev
    ports:
      - "6379:6379"
    networks:
      - labmanager-network
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: labmanager-mysql-dev
    restart: unless-stopped
    env_file: .env.development
    command: --max_connections=2000
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    networks:
      - labmanager-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .  
      dockerfile: Dockerfile
      target: server-dev
    container_name: labmanager-backend-dev
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app/server       
      - /app/node_modules          
      - /app/server/node_modules   
      - logs_data_dev:/app/server/logs       
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - labmanager-network
    command: sh -c "npx sequelize-cli db:create && npm run dev && npx sequelize-cli db:migrate"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: . 
      dockerfile: Dockerfile
      target: client-dev
    container_name: labmanager-frontend-dev
    restart: unless-stopped
    env_file: .env.development
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client      
      - /app/node_modules         
      - /app/client/node_modules  
    networks:
      - labmanager-network
    working_dir: /app/client
    command: sh -c "pnpm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      # node:lts-alpine has no wget; use node (always available) to probe the dev server
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: labmanager-minio-dev
    env_file: .env.development
    ports:
      - "9000:9000"  
      - "9001:9001"  
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - labmanager-network
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: labmanager-minio-setup-dev
    env_file: .env.development
    depends_on:
      - minio
    networks:
      - labmanager-network
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...' &&
      until mc alias set localminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        sleep 2;
      done &&
      echo 'Creating bucket (cura-uploads)...' &&
      mc mb localminio/cura-uploads || true &&
      echo 'Setting public policy for the public folder (logos, avatars)...' &&
      mc anonymous set download localminio/cura-uploads/public &&
      echo 'MinIO setup completed successfully!'
      "

volumes:
  mysql_data_dev:
    driver: local
  minio_data_dev:
    driver: local
  logs_data_dev:
    driver: local

networks:
  labmanager-network:
    driver: bridge