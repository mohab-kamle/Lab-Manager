name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build frontend
        working-directory: ./client
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run build -- --mode production

      - name: Upload frontend build to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "client/dist/*"
          target: "/home/ubuntu/Lab-Manager/client/dist/"

      # Deploy to EC2 via SSH
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          debug: true
          script: |
            cd /home/ubuntu/Lab-Manager

            echo "Updating repository..."
            git reset --hard
            git clean -fd
            git pull origin main

            echo "Generating root .env.production..."
            cat > .env.production <<EOF
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            VITE_SERVER=${{ secrets.VITE_SERVER }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            DOMAIN=${{ secrets.DOMAIN }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            EOF

            echo "Generating client .env.production..."
            cat > client/.env.production <<EOF
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            EOF

            echo "Generating server .env..."
            cat > server/.env <<EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            PROD_CLIENT_URL=${{ secrets.PROD_CLIENT_URL }}
            PRODUCTION_PAYMOB_API_KEY=${{ secrets.PRODUCTION_PAYMOB_API_KEY || '' }}
            PRODUCTION_PAYMOB_SECRET_KEY=${{ secrets.PRODUCTION_PAYMOB_SECRET_KEY || '' }}
            PRODUCTION_PAYMOB_INTEGRATION_ID=${{ secrets.PRODUCTION_PAYMOB_INTEGRATION_ID || '' }}
            PRODUCTION_PAYMOB_PUBLIC_KEY=${{ secrets.PRODUCTION_PAYMOB_PUBLIC_KEY || '' }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            SERVER_URL=${{ secrets.SERVER_URL }}
            EOF

            echo "Building and updating containers..."
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "Cleaning up unused images..."
            docker image prune -af

            echo "Deployment complete!"
