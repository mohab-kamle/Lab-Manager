name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
        
      # 1. Build the frontend locally on GitHub
      - name: Build frontend
        run: |
          # Create the env file inside the client folder manually
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" > client/.env.production

          # Install pnpm
          npm install -g pnpm

          # Install dependencies from the ROOT 
          pnpm install --frozen-lockfile

          # Run the build command specifically for the 'client' package
          # This runs the 'build' script defined in client/package.json
          pnpm --filter client run build -- --mode production
          
      # Create and push version tag
      - name: Create and push version tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          VERSION=$(node -p "require('./client/package.json').version")
          TAG="v${VERSION}"
          git tag "${TAG}"
          git push origin "${TAG}"
      # --- NEW: Configure AWS & Open Firewall ---
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Whitelist GitHub Runner IP
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP is $IP"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $IP/32

      # 2. Clean up the messy folder on EC2 & Update Git
      - name: Update Git Repo & Clean Dist
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/Lab-Manager
            
            # WIPE the messy dist folder completely
            rm -rf client/dist
            
            # Reset and Pull latest code
            git reset --hard
            git clean -fd
            git pull origin main
            
            # Recreate the empty directory for the upload
            mkdir -p client/dist

      # 3. Upload ONLY the build files
      - name: Upload frontend build to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          # This grabs files INSIDE client/dist
          source: "client/dist/*"
          # This puts them into the folder we just made
          target: "/home/ubuntu/Lab-Manager/client/dist"
          # This removes "client/dist" from the file path so they don't nest
          strip_components: 2

      # 4. Deploy / Restart Containers
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            cd /home/ubuntu/Lab-Manager

            echo "Generating root .env.production..."
            cat > .env.production <<EOF
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            NODE_ENV=production
            PORT=${{ secrets.PORT }}
            VITE_SERVER=${{ secrets.VITE_SERVER }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            DOMAIN=${{ secrets.DOMAIN }}
            CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
            MYSQL_USER=${{ secrets.MYSQL_USER }}
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            EOF

            echo "Generating server .env..."
            cat > server/.env <<EOF
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD || '' }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_HOST=${{ secrets.DB_HOST }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASS=${{ secrets.EMAIL_PASS }}
            PROD_CLIENT_URL=${{ secrets.PROD_CLIENT_URL }}
            PRODUCTION_PAYMOB_API_KEY=${{ secrets.PRODUCTION_PAYMOB_API_KEY || '' }}
            PRODUCTION_PAYMOB_SECRET_KEY=${{ secrets.PRODUCTION_PAYMOB_SECRET_KEY || '' }}
            PRODUCTION_PAYMOB_INTEGRATION_ID=${{ secrets.PRODUCTION_PAYMOB_INTEGRATION_ID || '' }}
            PRODUCTION_PAYMOB_PUBLIC_KEY=${{ secrets.PRODUCTION_PAYMOB_PUBLIC_KEY || '' }}
            CLIENT_URL=${{ secrets.CLIENT_URL }}
            SERVER_URL=${{ secrets.SERVER_URL }}
            EOF

            echo "Restarting containers..."
            # Force rebuild to update backend code
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            docker image prune -af
            echo "Deployment complete!"

      # --- NEW: Close Firewall (Always runs) ---
      - name: Revoke GitHub Runner IP
        if: always()
        run: |
          IP=$(curl -s https://checkip.amazonaws.com)
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr $IP/32