name: Deploy to Windows Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Create .env.production for frontend (UTF-8 encoded)
      - name: Create .env.production (UTF-8)
        shell: powershell
        run: |
          [System.IO.File]::WriteAllText("client/.env.production", "VITE_API_URL=${{ secrets.VITE_API_URL }}", [System.Text.Encoding]::UTF8)

      # Create empty .env for frontend (UTF-8 encoded)
      - name: Create empty .env (UTF-8)
        shell: powershell
        run: |
          [System.IO.File]::WriteAllText("client/.env", "", [System.Text.Encoding]::UTF8)

      # Copy .docker.env to server/.env
      - name: Copy .docker.env to server/.env
        shell: powershell
        run: |
          Copy-Item ".docker.env" "server/.env" -Force

      # Build and restart Docker containers
      - name: Build and restart Docker containers
        shell: powershell
        run: |
          docker compose down
          docker compose up -d --build --no-cache
