name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build Frontend Locally
      - name: Build frontend
        working-directory: ./client
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm run build -- --mode production

      # 2. Update Repo on EC2 (Cleaning happens HERE, before upload)
      - name: Update Git Repo on EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/Lab-Manager
            git reset --hard
            git clean -fd
            git pull origin main
            # Ensure the dist directory exists so SCP doesn't fail
            mkdir -p /home/ubuntu/Lab-Manager/client/dist

      # 3. Upload the 'dist' folder
      - name: Upload frontend build to EC2
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: "client/dist/*"
          target: "/home/ubuntu/Lab-Manager/client/dist"
          strip_components: 2

      # 4. Deploy / Restart Containers
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            cd /home/ubuntu/Lab-Manager

            # (Insert your .env generation scripts here as per previous conversation...)
            # I am omitting them for brevity, but KEEP THEM in your actual file.

            echo "Restarting containers..."
            
            # --build is required because 'backend' is built from source code
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            docker image prune -af
            echo "Deployment complete!"